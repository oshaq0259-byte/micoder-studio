name: Build and Release Micoder Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MicoderStudio-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicoderStudio-debug-apk
          path: app/build/outputs/apk/debug/MicoderStudio-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Micoder Studio v1.0 (Build #${{ github.run_number }})
          body: |
            ## 🎙️ Micoder Studio APK
            Free installable Android APK build for Micoder Studio.
            
            ### ✨ Features:
            - **Studio Audio Engine**: High-fidelity 48kHz audio capture with real-time waveform & clipping indicators.
            - **Live DSP Processing**: High-pass filter, noise gate, 3-band vocal EQ, de-esser, and compressor/limiter.
            - **3 Hardware Mic Profiles**: Mic Clear, Mic Studio, and Mic Crisp.
            - **5 Vocal Recording Modes**: Story Telling, Voice Record, Voice Over, Podcast Talk, and Interview.
            - **Export & Storage**: Multi-format transcoder (WAV, AAC, MP3) with direct save to device Downloads folder and system share.
            
            ### 📲 How to Install:
            1. Download `MicoderStudio-v1.0.apk` below directly onto your Android device.
            2. Tap the file to install (allow "Install from unknown sources" if prompted by your phone).
            3. Open Micoder Studio and grant microphone and audio permissions to record!
          files: |
            app/build/outputs/apk/debug/MicoderStudio-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
